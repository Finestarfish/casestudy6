services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_PATH: /app/data/marks.json
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment}
    volumes:
      - marks-data:/app/data
    restart: unless-stopped
volumes:
  marks-data:
